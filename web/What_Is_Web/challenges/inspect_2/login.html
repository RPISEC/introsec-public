<html>
<head>
    <title>Cat Cafe Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>
<body>
  <nav class="navbar">
    <div>
      <a href="index.html">Homepage</a>
    </div>
    <div>
      <a href="listing.html">Cat Listing</a>
    </div>
    <div>
      <a href="about.html">About Us</a>
    </div>
    <div>
      <a href="login.html">Client Login</a>
    </div>
  </nav>
  <div id="content">
    <h1>Client Login:</h1> 
    Login to schedule an appointment at the RPISEC cat cafe!!!! Pet lots of cats today!!
        
    <div id="error"></div>
    <form method="POST" onsubmit="redirectAfterSubmit(event)">
      <fieldset>
        <div>
          <label>Username</label>
          <div>
            <input type="text" name="user" id="name" placeholder="Username">
          </div>
        </div>
        <div>
          <label>Password</label>
          <div>
            <input type="password" name="pass" id="pass" placeholder="Password">
          </div>
        </div>
        <button name="form" type="submit">Login</button>
      </fieldset>
    </form>
  </div>
  <div class="flexbox">
    <img class="flexbox-item" src="images/cat_lying_down.avif" alt="Adorable cat">
    <p class="flexbox-item">Log in or this cat (Bob) will SMITE you</p>
  </div>
</body>
</html>
